name: Compact Overview height probe

on:
  push:
    branches: [proof/compact-overview-probe-20261107]

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      CODEXBAR_DISABLE_KEYCHAIN_ACCESS: "1"
      CODEXBAR_SUPPRESS_TEST_KEYCHAIN_ACCESS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Probe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe"
          source ./Scripts/test_environment.sh
          CODEXBAR_OVERVIEW_PROBE_DIR="$RUNNER_TEMP/probe" \
            swift test --filter 'CompactOverview' 2>&1 | tee "$RUNNER_TEMP/probe/test.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compact-overview-probe
          path: ${{ runner.temp }}/probe
