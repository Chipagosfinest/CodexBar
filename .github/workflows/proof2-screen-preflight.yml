name: Proof2 actual-screen PR menus
on:
  push:
    branches: [proof2-screen-preflight]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '4881'
            sha: 7dc9174267b5809433dbb326a233f30d3f5cf01d
          - pr: '4883'
            sha: d7ce5b51b3f6f6651012b7e5a1eb291632f0bbe0
          - pr: '4884'
            sha: 8c311de2545db92f4914629d3f0692a5dbf18acf
    env:
      PROOF_PR: ${{ matrix.pr }}
      PROOF_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Chipagosfinest/CodexBar
          ref: ${{ matrix.sha }}
          path: product
      - name: Select installed Xcode and record environment
        shell: bash
        run: |
          export PROOF_OUTPUT="$RUNNER_TEMP/proof-$PROOF_PR"
          echo "PROOF_OUTPUT=$PROOF_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_OUTPUT"
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          apps=list(pathlib.Path('/Applications').glob('Xcode*.app'))
          def version(p): return tuple(map(int,re.findall(r'\d+',p.name)))
          selected=max(apps,key=version)
          developer=str(selected/'Contents/Developer')
          subprocess.run(['sudo','xcode-select','-s',developer],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVELOPER_DIR='+developer+'\n')
          PY
          { sw_vers; launchctl managername; xcodebuild -version; swift --version; ls -d /Applications/Xcode*.app; } > "$PROOF_OUTPUT/environment.txt"
      - name: Add temporary opt-in fixture entry
        run: python3 proof2-preflight/prepare.py product
      - name: Build full CodexBar app target at exact PR head
        working-directory: product
        run: swift build --product CodexBar --jobs 3 > "$PROOF_OUTPUT/build.log" 2>&1
      - name: Package real app executable and resources
        run: python3 proof2-preflight/package.py product
      - name: Record actual native menu state transitions
        run: python3 proof2-preflight/capture.py
      - name: Upload actual-screen evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr${{ matrix.pr }}-actual-screen-${{ matrix.sha }}
          path: |
            ${{ env.PROOF_OUTPUT }}/*.mov
            ${{ env.PROOF_OUTPUT }}/*.png
            ${{ env.PROOF_OUTPUT }}/*.json
            ${{ env.PROOF_OUTPUT }}/*.txt
            ${{ env.PROOF_OUTPUT }}/*.log
            ${{ env.PROOF_OUTPUT }}/*.swift
            ${{ env.PROOF_OUTPUT }}/*.patch
          retention-days: 7
