name: UI proof packages
on:
  push:
    branches: [proof/ui-lane]
    paths: [proofkit/packages.txt]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pr: "4899", sha: 292ba68c892dbf9d51bfc95e5cd824db983bb9eb }
          - { pr: "4900", sha: 818e1e73784f20053912e8a7f59d677c9494e852 }
          - { pr: "4901", sha: 1d28182bdb63b6a27edcdb91bebf1189a368efea }
          - { pr: "4902", sha: ccadfbc339ea0205a271578daaef7f4a811ca092 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: steipete/CodexBar
          ref: ${{ matrix.sha }}
          path: product
          persist-credentials: false
      - name: Package the unmodified release app from the exact commit
        working-directory: product
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          command -v xcodegen >/dev/null || brew install xcodegen
          mkdir -p "$RUNNER_TEMP/pkg"
          ARCHES=arm64 CODEXBAR_SIGNING=adhoc ./Scripts/package_app.sh release > "$RUNNER_TEMP/pkg/package.log" 2>&1 || { tail -60 "$RUNNER_TEMP/pkg/package.log"; exit 1; }
          git rev-parse HEAD > "$RUNNER_TEMP/pkg/product-sha.txt"
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/pkg/tracked-source-changes.txt"
          shasum -a 256 CodexBar.app/Contents/MacOS/CodexBar > "$RUNNER_TEMP/pkg/binary-sha256.txt"
          ditto -c -k --sequesterRsrc --keepParent CodexBar.app "$RUNNER_TEMP/pkg/CodexBar.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pkg-${{ matrix.pr }}
          path: ${{ runner.temp }}/pkg
          retention-days: 7
