name: Packaged synthetic Overview footer - open-card oracle build and native refresh

on:
  push:
    branches: [proof/footer-runtime-20261106]
    paths:
      - footerproofkit/*.py
      - footerproofkit/*.swift
      - footerproofkit/candidate-production.patch
      - footerproofkit/capture-controls/**
      - .github/workflows/footer-app-oracle-proof.yml

permissions:
  contents: read

jobs:
  footer-app-proof:
    runs-on: macos-26-intel
    timeout-minutes: 50
    env:
      PRODUCT_SHA: e8a0cca51036fa8f30362a0710754d812ace34a3
      CODEXBAR_DISABLE_KEYCHAIN_ACCESS: "1"
      CODEXBAR_SUPPRESS_TEST_KEYCHAIN_ACCESS: "1"
      CODEXBAR_TEST_NATIVE_TIMEOUT: "2400"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: kit, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - name: Select Xcode and require actual-screen GUI capability before building app
        shell: bash
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/footer-app-proof/preflight"
          echo "PROOF_OUT=$RUNNER_TEMP/footer-app-proof" >> "$GITHUB_ENV"
          { sw_vers; xcodebuild -version; swift --version; launchctl managername; } > "$RUNNER_TEMP/footer-app-proof/environment.txt"
          test "$(launchctl managername)" = Aqua
          swiftc -parse-as-library kit/footerproofkit/ui.swift -o "$RUNNER_TEMP/footer-ui" > "$RUNNER_TEMP/footer-app-proof/helper-build.log" 2>&1
          python3 - <<'PY_PREFLIGHT'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'footer-app-proof/preflight'
          helper=str(pathlib.Path(os.environ['RUNNER_TEMP'])/'footer-ui')
          assert len(json.loads(subprocess.check_output([helper,'displays'])))==1
          subprocess.run(['sandbox-exec','-p','(version 1)(allow default)(deny network*)',helper,'preflight',str(out)],check=True,timeout=35)
          value=json.loads((out/'preflight.json').read_text())
          assert value['preflightPassed'] and value['actualCGEventOpenedNativeMenu']
          assert value['axTrusted'] and value['screenCaptureAllowed'] and value['postEventAllowed']
          media=json.loads(subprocess.check_output([helper,'media',str(out/'preflight-screen.mov')]))
          assert media['duration']>1.5 and media['width']>0
          (out/'media.json').write_text(json.dumps(media,indent=2)+'\n')
          PY_PREFLIGHT
      - name: Verify actual extracted oracle and native capture guard controls before cold build
        shell: bash
        run: |
          set -euo pipefail
          python3 kit/footerproofkit/run_oracle_controls.py "$PROOF_OUT/oracle-controls" > "$PROOF_OUT/oracle-controls.log"
          python3 kit/footerproofkit/driver_controls.py > "$PROOF_OUT/driver-controls.json"
          swiftc -parse-as-library kit/footerproofkit/menu_arrow.swift -o "$RUNNER_TEMP/footer-arrow"
          swiftc -parse-as-library kit/footerproofkit/arrow_controls.swift -o "$RUNNER_TEMP/footer-arrow-controls"
          "$RUNNER_TEMP/footer-arrow-controls" "$PROOF_OUT/arrow-controls"
          python3 kit/footerproofkit/check_arrow_controls.py "$RUNNER_TEMP/footer-arrow" "$PROOF_OUT/arrow-controls" > "$PROOF_OUT/arrow-controls.json"
          python3 kit/footerproofkit/capture_controls.py "$RUNNER_TEMP/footer-ui" kit/footerproofkit/capture-controls > "$PROOF_OUT/capture-controls.json"
          cp kit/footerproofkit/capture-controls/provenance.json "$PROOF_OUT/capture-control-provenance.json"
      - name: Apply only declared synthetic early-entry overlay
        shell: bash
        run: |
          set -euo pipefail
          defaults write NSGlobalDomain AppleLanguages -array en
          python3 kit/footerproofkit/prepare_overlay.py --apply-to-disposable-copy "$PWD/product" --manifest-output "$PROOF_OUT/overlay-manifest.json"
          python3 kit/footerproofkit/verify_inputs.py product "$PROOF_OUT" --inputs-only
          cp kit/footerproofkit/candidate-production.patch "$PROOF_OUT/candidate-production.patch"
          git -C product add --intent-to-add Sources/CodexBar/PackagedFooterProof.swift
          git -C product diff --binary HEAD > "$PROOF_OUT/overlay.patch"
          git -C kit rev-parse HEAD > "$PROOF_OUT/controller-sha.txt"
          shasum -a 256 kit/footerproofkit/{PackagedFooterProof.swift,prepare_overlay.py,ui.swift,drive.py,verify_inputs.py,capture_geometry.py,capture_controls.py,run_oracle_controls.py,OracleControls.swift,wait_process.py,driver_controls.py,menu_arrow.swift,arrow_controls.swift,check_arrow_controls.py,summarize.py} > "$PROOF_OUT/controller-input-sha256.txt"
          cp kit/footerproofkit/PackagedFooterProof.swift "$PROOF_OUT/"
          printf '%s\n' '(version 1)(allow default)(deny network*)' > "$PROOF_OUT/runtime-network-deny.sb"
      - name: Build and package actual DEBUG app with upstream adhoc recipe
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          CODEXBAR_SIGNING=adhoc ./Scripts/package_app.sh debug > "$PROOF_OUT/package.log" 2>&1 || { tail -120 "$PROOF_OUT/package.log"; exit 1; }
          python3 ../kit/footerproofkit/verify_inputs.py . "$PROOF_OUT"
          codesign --verify --deep --strict --verbose=2 CodexBar.app > "$PROOF_OUT/signature-verification.txt" 2>&1
          cp CodexBar.app/Contents/Info.plist "$PROOF_OUT/bundle-Info.plist"
          ditto -c -k --sequesterRsrc --keepParent CodexBar.app "$PROOF_OUT/proof-built-CodexBar.app.zip"
      - name: Drive actual root and More card through controlled refresh without reopening
        shell: bash
        run: |
          set -euo pipefail
          overlay_sha=$(shasum -a 256 "$PROOF_OUT/overlay.patch" | awk '{print $1}')
          python3 kit/footerproofkit/drive.py --app "$PWD/product/CodexBar.app" --helper "$RUNNER_TEMP/footer-ui" --arrow-helper "$RUNNER_TEMP/footer-arrow" --output "$PROOF_OUT" --runtime-root "$RUNNER_TEMP/footer-runtime" --overlay-sha "$overlay_sha" > "$PROOF_OUT/driver.log" 2>&1 || { tail -100 "$PROOF_OUT/driver.log"; exit 1; }
          python3 kit/footerproofkit/verify_inputs.py product "$PROOF_OUT"
          cat "$PROOF_OUT/ui-verdict.json"
      - name: Preserve readable terminal classification without claiming uninspected UI acceptance
        if: always()
        shell: bash
        run: |
          python3 kit/footerproofkit/summarize.py "$RUNNER_TEMP/footer-app-proof"
          cat "$RUNNER_TEMP/footer-app-proof/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: packaged-footer-oracle-${{ env.PRODUCT_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/footer-app-proof
          retention-days: 14
