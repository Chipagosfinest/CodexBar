name: Cursor synthetic production-owner static App UI proof
on:
  push:
    branches: [proof/cursor-app-runtime-20261106]
    paths:
      - .github/workflows/cursor-app-proof.yml
      - cursorproofkit/PackagedCursorProof.swift
      - cursorproofkit/FixtureSupport.swift
      - cursorproofkit/FixtureControls.swift
      - cursorproofkit/controls.py
      - cursorproofkit/guards.py
      - cursorproofkit/prepare_overlay.py
      - cursorproofkit/verify_inputs.py
      - cursorproofkit/drive.py
      - cursorproofkit/ui.swift
permissions:
  contents: read
jobs:
  cursor-static-ui:
    runs-on: macos-26-intel
    timeout-minutes: 50
    env:
      PRODUCT_SHA: fba37ba92f696416b36f49d4de89affcda3888ee
      CODEXBAR_DISABLE_KEYCHAIN_ACCESS: "1"
      CODEXBAR_SUPPRESS_TEST_KEYCHAIN_ACCESS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: kit, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: product, ref: '${{ env.PRODUCT_SHA }}', persist-credentials: false}
      - name: Native permission and fixture preflight before cold build
        shell: bash
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          export DEVELOPER_DIR="$latest/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          export PROOF_OUT="$RUNNER_TEMP/cursor-app-proof"
          echo "PROOF_OUT=$PROOF_OUT" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_OUT/preflight"
          { sw_vers; xcodebuild -version; xcrun swiftc --version; launchctl managername; } > "$PROOF_OUT/environment.txt"
          test "$(launchctl managername)" = Aqua
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          xcrun --sdk macosx swiftc -sdk "$sdk" -parse-as-library kit/cursorproofkit/ui.swift -o "$RUNNER_TEMP/cursor-ui" > "$PROOF_OUT/helper-build.log" 2>&1
          python3 kit/cursorproofkit/controls.py "$PROOF_OUT/fixture-controls" > "$PROOF_OUT/fixture-controls.log"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          helper=str(pathlib.Path(os.environ['RUNNER_TEMP'])/'cursor-ui')
          out=pathlib.Path(os.environ['PROOF_OUT'])/'preflight'
          assert len(json.loads(subprocess.check_output([helper,'displays'])))==1
          subprocess.run(['sandbox-exec','-p','(version 1)(allow default)(deny network*)',helper,'preflight',str(out)],check=True,timeout=35)
          v=json.loads((out/'preflight.json').read_text())
          assert all(v[k] for k in ['preflightPassed','actualCGEventOpenedNativeMenu','axTrusted','screenCaptureAllowed','postEventAllowed'])
          PY
      - name: Apply and verify only declared overlay
        shell: bash
        run: |
          set -euo pipefail
          defaults write NSGlobalDomain AppleLanguages -array en
          python3 kit/cursorproofkit/prepare_overlay.py --apply-to-disposable-copy "$PWD/product" --manifest-output "$PROOF_OUT/overlay-manifest.json"
          python3 kit/cursorproofkit/verify_inputs.py product "$PROOF_OUT" --inputs-only
          git -C product diff --binary HEAD > "$PROOF_OUT/overlay.patch"
          git -C kit rev-parse HEAD > "$PROOF_OUT/controller-sha.txt"
          shasum -a 256 kit/cursorproofkit/{PackagedCursorProof.swift,FixtureSupport.swift,FixtureControls.swift,controls.py,guards.py,prepare_overlay.py,verify_inputs.py,drive.py,ui.swift} > "$PROOF_OUT/controller-input-sha256.txt"
      - name: Build actual DEBUG App and verify source and bundle
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          CODEXBAR_SIGNING=adhoc ./Scripts/package_app.sh debug > "$PROOF_OUT/package.log" 2>&1 || { tail -100 "$PROOF_OUT/package.log"; exit 1; }
          python3 ../kit/cursorproofkit/verify_inputs.py . "$PROOF_OUT"
          codesign --verify --deep --strict CodexBar.app > "$PROOF_OUT/codesign.log" 2>&1
          ditto -c -k --sequesterRsrc --keepParent CodexBar.app "$PROOF_OUT/proof-built-CodexBar.app.zip"
      - name: Two independent synthetic real-owner static UI scenarios
        shell: bash
        run: |
          set -euo pipefail
          overlay_sha=$(shasum -a 256 "$PROOF_OUT/overlay.patch" | awk '{print $1}')
          python3 kit/cursorproofkit/drive.py --app "$PWD/product/CodexBar.app" --helper "$RUNNER_TEMP/cursor-ui" --output "$PROOF_OUT" --runtime-root "$RUNNER_TEMP/cursor-proof-runtime" --overlay-sha "$overlay_sha" > "$PROOF_OUT/driver.log" 2>&1 || { tail -100 "$PROOF_OUT/driver.log"; exit 1; }
          python3 kit/cursorproofkit/verify_inputs.py product "$PROOF_OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cursor-static-app-fba37ba-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cursor-app-proof
          retention-days: 14
