name: Review regressions - bounded red and green

on:
  push:
    branches: [proof/20261106-review-regressions]

permissions:
  contents: read

jobs:
  regression-proof:
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: core, sha: b3e44381197a743c88a5f82d9008848e8a578b44, expect: green}
          - {case: chart, sha: cf6efdea76161eb3061e0b954d8150231181149f, expect: red}
          - {case: chart, sha: cf6efdea76161eb3061e0b954d8150231181149f, expect: green}
          - {case: footer, sha: 13185f0888b8e60ad22f72d66767f23601d7b960, expect: green}
    env:
      PRODUCT_SHA: ${{ matrix.sha }}
      PROOF_CASE: ${{ matrix.case }}
      PROOF_EXPECT: ${{ matrix.expect }}
      CODEXBAR_DISABLE_KEYCHAIN_ACCESS: "1"
      CODEXBAR_SUPPRESS_TEST_KEYCHAIN_ACCESS: "1"
      CODEXBAR_TEST_NATIVE_TIMEOUT: "2400"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: kit, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - name: Select installed Xcode and containment-capable Python
        shell: bash
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
          proof_python=""
          for candidate in "$(command -v python3)" /opt/homebrew/bin/python3.14 /opt/homebrew/opt/python@3.14/bin/python3.14; do
            if [[ -x "$candidate" ]] && "$candidate" -c 'import os; assert all(hasattr(os, n) for n in ("waitid", "P_PID", "WEXITED", "WNOHANG", "WNOWAIT"))'; then
              proof_python="$candidate"
              break
            fi
          done
          if [[ -z "$proof_python" ]]; then
            brew install python@3.14
            proof_python="$(brew --prefix python@3.14)/bin/python3.14"
          fi
          "$proof_python" -c 'import os; assert all(hasattr(os, n) for n in ("waitid", "P_PID", "WEXITED", "WNOHANG", "WNOWAIT"))'
          mkdir -p "$RUNNER_TEMP/proof-python" "$RUNNER_TEMP/review-regression-proof"
          ln -s "$proof_python" "$RUNNER_TEMP/proof-python/python3"
          echo "$RUNNER_TEMP/proof-python" >> "$GITHUB_PATH"
          echo "PROOF_OUT=$RUNNER_TEMP/review-regression-proof" >> "$GITHUB_ENV"
          { sw_vers; xcodebuild -version; "$proof_python" --version; launchctl managername; } > "$RUNNER_TEMP/review-regression-proof/environment.txt"
      - name: Prepare bounded synthetic test harness and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 kit/proofkit/regression_proof.py prepare --case "$PROOF_CASE" --expect "$PROOF_EXPECT" --product product --output "$PROOF_OUT" > "$PROOF_OUT/filter.txt"
          cat "$PROOF_OUT/provenance.json"
      - name: Require declared runtime regression result
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          filter=$(cat "$PROOF_OUT/filter.txt")
          set +e
          ./Scripts/test_fast.sh --jobs 2 --filter "$filter" > "$PROOF_OUT/tests.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$PROOF_OUT/test-exit.txt"
          tail -100 "$PROOF_OUT/tests.log"
          python3 ../kit/proofkit/regression_proof.py verify --case "$PROOF_CASE" --expect "$PROOF_EXPECT" --product . --output "$PROOF_OUT" --exit-code "$result"
      - name: Render opt-in synthetic compact row proof after green
        if: ${{ matrix.case == 'core' && matrix.expect == 'green' }}
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_OUT/rendered"
          export COMPACT_FRESHNESS_PROOF_OUTPUT="$PROOF_OUT/rendered"
          export PROOF_PRODUCT_SHA="$PRODUCT_SHA"
          export PROOF_DELTA_SHA=$(python3 -c 'import json, os; print(json.load(open(os.environ["PROOF_OUT"] + "/provenance.json"))["candidate_production_patch_sha256"])')
          shasum -a 256 Tests/CodexBarTests/OverviewProviderLineFreshnessTests.swift > "$PROOF_OUT/rendered/test-before-sha256.txt"
          cat ../kit/proofkit/rendering/CompactFreshnessProof.swift.fragment >> Tests/CodexBarTests/OverviewProviderLineFreshnessTests.swift
          shasum -a 256 Tests/CodexBarTests/OverviewProviderLineFreshnessTests.swift > "$PROOF_OUT/rendered/test-render-sha256.txt"
          cp Tests/CodexBarTests/OverviewProviderLineFreshnessTests.swift "$PROOF_OUT/rendered/render-fixture.swift"
          git diff --binary HEAD > "$PROOF_OUT/rendered/render-harness.patch"
          ./Scripts/test_fast.sh --jobs 2 --filter 'OverviewProviderLineFreshnessTests.*render synthetic compact freshness states' > "$PROOF_OUT/rendered/tests.log" 2>&1
          test -s "$PROOF_OUT/rendered/compact-freshness-light.png"
          test -s "$PROOF_OUT/rendered/compact-freshness-dark.png"
          test -s "$PROOF_OUT/rendered/states.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: review-${{ matrix.expect }}-${{ matrix.case }}-${{ matrix.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-regression-proof
          retention-days: 14
