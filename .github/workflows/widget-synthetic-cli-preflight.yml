# Finder cross-app UI smoke passed in run 35119627828.
# Reuses an already validated package artifact and launches CodexBar for the GUI proof.
name: Widget synthetic CLI preflight

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Existing successful Widget package proof run
        required: false
        default: "35117930549"
        type: string
      package_source_sha:
        description: Exact source recorded in the package artifact
        required: false
        default: d223726ffd8d9d60c3eab54af55e730b7291669c
        type: string
      widget_gallery_discovery:
        description: Record public desktop widget-gallery discovery evidence after share proof
        required: false
        default: false
        type: boolean
      widget_family:
        description: Installed Switcher family to exercise
        required: false
        default: small
        type: choice
        options:
          - small
          - medium
  push:
    branches: [validation/native-spend-share-proof]
    paths:
      - .github/workflows/widget-synthetic-cli-preflight.yml

permissions:
  actions: read
  contents: read

jobs:
  synthetic-cli-preflight:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      PACKAGE_RUN_ID: ${{ inputs.package_run_id || '35117930549' }}
      EXPECTED_PACKAGE_SHA: ${{ inputs.package_source_sha || 'd223726ffd8d9d60c3eab54af55e730b7291669c' }}
      WIDGET_FAMILY: ${{ inputs.widget_family || 'small' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Download the existing package proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: widget-package-proof
          repository: ${{ github.repository }}
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/widget-package-proof

      - name: Verify and unpack the exact debug package
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/widget-synthetic-cli-preflight"
          package="$RUNNER_TEMP/widget-package-proof"
          test "$(tr -d '\n' < "$package/source-commit.txt")" = "$EXPECTED_PACKAGE_SHA"
          test "$(awk -F= '/^app_bundle_id=/{print $2}' "$package/bundle-metadata.txt")" = com.steipete.codexbar.debug
          test "$(awk -F= '/^widget_bundle_id=/{print $2}' "$package/bundle-metadata.txt")" = com.steipete.codexbar.debug.widget
          mkdir -p "$proof/app"
          ditto -x -k "$package/CodexBar-debug-widget-package.zip" "$proof/app"
          app="$proof/app/CodexBar.app"
          test -x "$app/Contents/Helpers/CodexBarCLI"
          codesign --verify --deep --strict "$app"
          printf '%s\n' "$EXPECTED_PACKAGE_SHA" > "$proof/package-source-commit.txt"

      - name: Seed only runner-owned Claude input and run packaged CLI
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/widget-synthetic-cli-preflight"
          seed="$proof/seed"
          export TZ=UTC
          export CODEX_HOME="$seed/codex-home"
          export CODEXBAR_CONFIG="$seed/config.json"
          export CLAUDE_CONFIG_DIR="$seed/claude-config"
          export CI_CLI="$proof/app/CodexBar.app/Contents/Helpers/CodexBarCLI"
          EXPECTED_DAY="$(date -u +%F)"
          export EXPECTED_DAY
          mkdir -p "$CODEX_HOME" "$CLAUDE_CONFIG_DIR/projects/synthetic-widget-proof"
          export CI_CLAUDE_FILE="$CLAUDE_CONFIG_DIR/projects/synthetic-widget-proof/usage.jsonl"
          python3 - <<'PY'
          import datetime, json, os, pathlib
          now = datetime.datetime.now(datetime.timezone.utc)
          row = {
              "type": "assistant",
              "timestamp": now.isoformat().replace("+00:00", "Z"),
              "sessionId": "synthetic-ci-only",
              "requestId": "synthetic-request-only",
              "message": {
                  "id": "synthetic-message-only",
                  "model": "claude-sonnet-4-5",
                  "usage": {
                      "input_tokens": 100000,
                      "output_tokens": 10000,
                      "cache_creation_input_tokens": 0,
                      "cache_read_input_tokens": 0,
                  },
              },
          }
          pathlib.Path(os.environ["CI_CLAUDE_FILE"]).write_text(json.dumps(row, separators=(",", ":")) + "\n")
          PY
          generated_default="$seed/generated-default-config.json"
          "$CI_CLI" config dump > "$generated_default"
          python3 - <<'PY'
          import json, pathlib, os
          generated = pathlib.Path(os.environ["CODEX_HOME"]).parent / "generated-default-config.json"
          config = json.loads(generated.read_text())
          for provider in config["providers"]:
              for key, value in provider.items():
                  if key.lower() in {"apikey", "secretkey", "token", "cookies"}:
                      assert not value, f"generated default unexpectedly contains {key}"
              provider["enabled"] = provider["id"] in {"codex", "claude"}
          pathlib.Path(os.environ["CODEXBAR_CONFIG"]).write_text(json.dumps(config, indent=2) + "\n")
          PY
          "$CI_CLI" config validate
          "$CI_CLI" config providers --format json > "$proof/provider-status.json"
          export CI_PROVIDER_STATUS_JSON="$proof/provider-status.json"
          python3 - <<'PYPROVIDERS'
          import json, os, pathlib
          providers = json.loads(pathlib.Path(os.environ["CI_PROVIDER_STATUS_JSON"]).read_text())
          assert [item["provider"] for item in providers if item["enabled"]] == ["codex", "claude"], providers
          PYPROVIDERS
          "$CI_CLI" cost --provider claude --provider-native-only --refresh --format json > "$proof/claude-cost.json"
          export CI_COST_JSON="$proof/claude-cost.json"
          python3 - <<'PY'
          import json, os, pathlib
          payload = json.loads(pathlib.Path(os.environ["CI_COST_JSON"]).read_text())
          assert isinstance(payload, list) and len(payload) == 1, payload
          cost = payload[0]
          assert cost["provider"] == "claude", cost
          assert cost["source"] == "local", cost
          assert cost.get("error") is None, cost
          today = [entry for entry in cost["daily"] if entry["date"] == os.environ["EXPECTED_DAY"]]
          assert len(today) == 1, cost
          assert today[0]["totalTokens"] == 110000, today[0]
          assert abs(float(today[0]["totalCost"]) - 0.45) < 1e-9, today[0]
          totals = cost["totals"]
          assert totals["totalTokens"] == 110000, totals
          assert abs(float(totals["totalCost"]) - 0.45) < 1e-9, totals
          PY

      - name: Configure disposable debug app and GUI seed environment
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/widget-synthetic-cli-preflight"
          seed="$proof/seed"
          app="$proof/app/CodexBar.app"
          test -d "$app"
          test -f "$seed/config.json"
          test -d "$seed/codex-home"
          test -f "$seed/claude-config/projects/synthetic-widget-proof/usage.jsonl"
          domain=com.steipete.codexbar.debug
          # Provider configuration was explicitly seeded above. Mark normal first-run
          # detection complete so absent CLI installations do not replace it with Codex.
          defaults write "$domain" providerDetectionCompleted -bool YES
          defaults write "$domain" tokenCostUsageEnabled -bool YES
          defaults write "$domain" debugDisableKeychainAccess -bool YES
          # This records an informed decline for the known modal consent. It does not
          # suppress macOS notification authorization, which may still block the GUI run.
          defaults write "$domain" adaptiveActivityScanConsent -string declined
          defaults write "$domain" appLanguage -string en
          defaults write "$domain" selectedMenuProvider -string claude
          for key in statusChecksEnabled sessionQuotaNotificationsEnabled quotaWarningNotificationsEnabled predictivePaceWarningNotificationsEnabled agentSessionsEnabled iCloudSyncEnabled openCodexUsageLogsEnabled; do
            defaults write "$domain" "$key" -bool NO
          done
          defaults read "$domain" > "$proof/disposable-debug-defaults.txt"
          # LaunchServices receives these values from the GUI launchd environment.
          # Do not inject XCTest state into the packaged app.
          for key in XCTestConfigurationFilePath XCTestBundlePath XCTestSessionIdentifier TESTING_LIBRARY_VERSION SWIFT_TESTING SWIFT_TESTING_ENABLED; do
            launchctl unsetenv "$key" || true
          done
          launchctl setenv CODEX_HOME "$seed/codex-home"
          launchctl setenv CODEXBAR_CONFIG "$seed/config.json"
          launchctl setenv CLAUDE_CONFIG_DIR "$seed/claude-config"
          # Start the exact app outside XCTest. A macOS notification prompt remains a
          # real first-launch gate; the XCUITest result retains a screen attachment if it blocks.
          open -n -g "$app"
          export CODEXBAR_CI_APP_EXECUTABLE="$app/Contents/MacOS/CodexBar"
          export CODEXBAR_CI_EXPECTED_CODEX_HOME="$seed/codex-home"
          export CODEXBAR_CI_EXPECTED_CONFIG="$seed/config.json"
          export CODEXBAR_CI_EXPECTED_CLAUDE_CONFIG_DIR="$seed/claude-config"
          python3 - <<'PYVERIFY'
          import json, os, pathlib, subprocess, time
          deadline = time.monotonic() + 20
          forbidden = ("XCTestConfigurationFilePath", "XCTestBundlePath", "XCTestSessionIdentifier", "TESTING_LIBRARY_VERSION", "SWIFT_TESTING", "SWIFT_TESTING_ENABLED")
          while time.monotonic() < deadline:
              found = subprocess.run(["/usr/bin/pgrep", "-x", "CodexBar"], capture_output=True, text=True)
              for pid in found.stdout.split():
                  result = subprocess.run(["/bin/ps", "eww", "-p", pid, "-o", "command="], capture_output=True, text=True)
                  data = result.stdout
                  if not data.startswith(os.environ["CODEXBAR_CI_APP_EXECUTABLE"]):
                      continue
                  assert "CODEX_HOME=" + os.environ["CODEXBAR_CI_EXPECTED_CODEX_HOME"] in data, "App did not inherit synthetic Codex root"
                  assert "CODEXBAR_CONFIG=" + os.environ["CODEXBAR_CI_EXPECTED_CONFIG"] in data, "App did not inherit synthetic config"
                  assert "CLAUDE_CONFIG_DIR=" + os.environ["CODEXBAR_CI_EXPECTED_CLAUDE_CONFIG_DIR"] in data, "App did not inherit synthetic Claude root"
                  assert not any(key + "=" in data for key in forbidden), "Test flags reached the packaged app"
                  evidence = {"pid": int(pid), "exactPackagedExecutable": True, "syntheticClaudeEnvironmentVerified": True, "testFlagsAbsent": True}
                  pathlib.Path(os.environ["RUNNER_TEMP"], "widget-synthetic-cli-preflight/app-environment-proof.json").write_text(json.dumps(evidence) + "\n")
                  raise SystemExit(0)
              time.sleep(0.2)
          raise SystemExit("Exact packaged debug app did not start within 20 seconds")
          PYVERIFY

      # GitHub's image disables this service in configure-system.sh. Restore only
      # this disposable runner's normal desktop UI; no TCC or widget database edits.
      - name: Enable Notification Center for desktop widget proof
        if: github.event_name == 'push' || inputs.widget_gallery_discovery == true || inputs.widget_family == 'medium'
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/widget-synthetic-cli-preflight"
          agent=/System/Library/LaunchAgents/com.apple.notificationcenterui.plist
          test -f "$agent"
          label=$(/usr/libexec/PlistBuddy -c 'Print :Label' "$agent")
          test "$label" = com.apple.notificationcenterui.agent
          launchctl print-disabled "gui/$(id -u)" > "$proof/gui-disabled-services-before.txt"
          grep -F "\"$label\" => disabled" "$proof/gui-disabled-services-before.txt"
          launchctl load -w "$agent"
          touch "$proof/notification-center-enabled-by-proof"
          launchctl print "gui/$(id -u)/$label" > "$proof/notification-center-service.txt"

      - name: Observe real warm and cold share route with XCUITest
        env:
          CODEXBAR_CI_PACKAGED_APP: ${{ runner.temp }}/widget-synthetic-cli-preflight/app/CodexBar.app
          CODEXBAR_CI_SEED_ROOT: ${{ runner.temp }}/widget-synthetic-cli-preflight/seed
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/widget-synthetic-cli-preflight"
          xcodebuild test \
            -project .github/proof/WidgetDesktopSmoke/WidgetDesktopSmoke.xcodeproj \
            -scheme WidgetDesktopSmoke \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$proof/WidgetDesktopSmokeDerivedData" \
            -resultBundlePath "$proof/PackagedShare.xcresult" \
            -only-testing:WidgetDesktopSmokeUITests/PackagedCodexBarShareUITests \
            CODEXBAR_CI_PACKAGED_PROOF=1 \
            CODEXBAR_CI_RUNNER_TEMP="$RUNNER_TEMP" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODEXBAR_CI_PACKAGED_APP="$CODEXBAR_CI_PACKAGED_APP" \
            CODEXBAR_CI_SEED_ROOT="$CODEXBAR_CI_SEED_ROOT" \
            2>&1 | tee "$proof/packaged-share-xcodebuild.log"
          python3 - <<'PYRESULT'
          import os, pathlib, re
          log = pathlib.Path(os.environ["RUNNER_TEMP"], "widget-synthetic-cli-preflight/packaged-share-xcodebuild.log").read_text()
          assert re.search(r"Test Case .*testPackagedAppOpensPopulatedSharePreviewWarmAndCold.* passed \(", log), "Required GUI test did not execute and pass"
          assert "Test skipped" not in log, "GUI proof must not skip its selected test"
          PYRESULT

      - name: Record synthetic widget storage and group entitlements
        run: |
          set -euo pipefail
          python3 - <<'PYSTORAGE'
          import json, os, pathlib, plistlib, subprocess
          proof = pathlib.Path(os.environ["RUNNER_TEMP"], "widget-synthetic-cli-preflight")
          app = proof / "app/CodexBar.app"
          extensions = list((app / "Contents/PlugIns").glob("*.appex"))
          assert len(extensions) == 1, "Expected one packaged widget extension"
          evidence = {"bundles": [], "snapshots": []}
          for bundle in [app, extensions[0]]:
              info = plistlib.loads((bundle / "Contents/Info.plist").read_bytes())
              result = subprocess.run(["codesign", "-d", "--entitlements", ":-", str(bundle)], check=True, capture_output=True)
              entitlements = plistlib.loads(result.stdout)
              evidence["bundles"].append({"id": info["CFBundleIdentifier"], "team": info.get("CodexBarTeamID"), "groups": entitlements.get("com.apple.security.application-groups", [])})
          base = pathlib.Path.home() / "Library"
          candidates = {
              "sharedGroup": base / "Group Containers/Y5PE65HELJ.com.steipete.codexbar.debug/widget-snapshot.json",
              "appFallback": base / "Application Support/CodexBar/widget-snapshot.json",
          }
          for kind, path in candidates.items():
              item = {"location": kind, "exists": path.is_file()}
              if path.is_file():
                  snapshot = json.loads(path.read_text())
                  item["generatedAt"] = snapshot.get("generatedAt")
                  item["enabledProviders"] = snapshot.get("enabledProviders")
                  item["entries"] = [{"provider": entry.get("provider"), "tokenUsage": entry.get("tokenUsage")} for entry in snapshot.get("entries", [])]
              evidence["snapshots"].append(item)
          (proof / "widget-storage-proof.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PYSTORAGE

      - name: Record desktop widget gallery discovery evidence
        if: github.event_name == 'push' || inputs.widget_gallery_discovery == true || inputs.widget_family == 'medium'
        env:
          CODEXBAR_CI_PACKAGED_APP: ${{ runner.temp }}/widget-synthetic-cli-preflight/app/CodexBar.app
          CODEXBAR_CI_SEED_ROOT: ${{ runner.temp }}/widget-synthetic-cli-preflight/seed
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/widget-synthetic-cli-preflight"
          xcodebuild test \
            -project .github/proof/WidgetDesktopSmoke/WidgetDesktopSmoke.xcodeproj \
            -scheme WidgetDesktopSmoke \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$proof/WidgetDesktopSmokeDerivedData" \
            -resultBundlePath "$proof/WidgetGalleryDiscovery.xcresult" \
            -only-testing:WidgetDesktopSmokeUITests/PackagedWidgetGalleryDiscoveryUITests \
            CODEXBAR_CI_RUNNER_TEMP="$RUNNER_TEMP" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODEXBAR_CI_PACKAGED_APP="$CODEXBAR_CI_PACKAGED_APP" \
            CODEXBAR_CI_SEED_ROOT="$CODEXBAR_CI_SEED_ROOT" \
            CODEXBAR_CI_WIDGET_FAMILY="$WIDGET_FAMILY" \
            2>&1 | tee "$proof/widget-gallery-discovery-xcodebuild.log"
          python3 - <<'PYRESULT'
          import os, pathlib, re
          log = pathlib.Path(os.environ["RUNNER_TEMP"], "widget-synthetic-cli-preflight/widget-gallery-discovery-xcodebuild.log").read_text()
          assert re.search(r"Test Case .*testRecordsDesktopWidgetGalleryDiscoveryEvidence.* passed \(", log), "Widget gallery discovery did not execute and pass"
          assert "Test skipped" not in log, "Widget gallery discovery must not report a skip as evidence"
          PYRESULT

      - name: Record provider configuration after actual app launch
        if: always()
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/widget-synthetic-cli-preflight"
          if test -f "$proof/seed/config.json"; then
            CODEXBAR_CONFIG="$proof/seed/config.json" "$proof/app/CodexBar.app/Contents/Helpers/CodexBarCLI" config providers --format json > "$proof/provider-status-after-app.json"
            python3 - <<'PYPROVIDERS'
          import json, os, pathlib
          providers = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "widget-synthetic-cli-preflight/provider-status-after-app.json").read_text())
          assert [p["provider"] for p in providers if p["enabled"]] == ["codex", "claude"], "App changed explicitly seeded provider scope"
          PYPROVIDERS
          fi

      - name: Export inspectable UI attachments
        if: always()
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/widget-synthetic-cli-preflight"
          if test -d "$proof/PackagedShare.xcresult"; then
            xcrun xcresulttool get test-results summary --path "$proof/PackagedShare.xcresult" > "$proof/test-summary.json"
            xcrun xcresulttool export attachments --path "$proof/PackagedShare.xcresult" --output-path "$proof/attachments"
          fi
          if test -d "$proof/WidgetGalleryDiscovery.xcresult"; then
            xcrun xcresulttool get test-results summary --path "$proof/WidgetGalleryDiscovery.xcresult" > "$proof/widget-gallery-discovery-summary.json"
            xcrun xcresulttool export attachments --path "$proof/WidgetGalleryDiscovery.xcresult" --output-path "$proof/widget-gallery-discovery-attachments"
          fi

      - name: Restore disposable runner Notification Center state
        if: always()
        run: |
          proof="$RUNNER_TEMP/widget-synthetic-cli-preflight"
          if test -f "$proof/notification-center-enabled-by-proof"; then
            launchctl unload -w /System/Library/LaunchAgents/com.apple.notificationcenterui.plist
          fi

      - name: Clear disposable GUI seed environment
        if: always()
        run: |
          launchctl unsetenv CODEX_HOME || true
          launchctl unsetenv CODEXBAR_CONFIG || true
          launchctl unsetenv CLAUDE_CONFIG_DIR || true
          for key in XCTestConfigurationFilePath XCTestBundlePath XCTestSessionIdentifier TESTING_LIBRARY_VERSION SWIFT_TESTING SWIFT_TESTING_ENABLED; do
            launchctl unsetenv "$key" || true
          done

      - name: Upload redacted CLI preflight proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: widget-synthetic-cli-preflight
          path: |
            ${{ runner.temp }}/widget-synthetic-cli-preflight/gui-disabled-services-before.txt
            ${{ runner.temp }}/widget-synthetic-cli-preflight/notification-center-service.txt
            ${{ runner.temp }}/widget-synthetic-cli-preflight/widget-storage-proof.json
            ${{ runner.temp }}/widget-synthetic-cli-preflight/package-source-commit.txt
            ${{ runner.temp }}/widget-synthetic-cli-preflight/provider-status.json
            ${{ runner.temp }}/widget-synthetic-cli-preflight/provider-status-after-app.json
            ${{ runner.temp }}/widget-synthetic-cli-preflight/claude-cost.json
            ${{ runner.temp }}/widget-synthetic-cli-preflight/app-environment-proof.json
            ${{ runner.temp }}/widget-synthetic-cli-preflight/disposable-debug-defaults.txt
            ${{ runner.temp }}/widget-synthetic-cli-preflight/packaged-share-xcodebuild.log
            ${{ runner.temp }}/widget-synthetic-cli-preflight/PackagedShare.xcresult
            ${{ runner.temp }}/widget-synthetic-cli-preflight/test-summary.json
            ${{ runner.temp }}/widget-synthetic-cli-preflight/attachments
            ${{ runner.temp }}/widget-synthetic-cli-preflight/widget-gallery-discovery-xcodebuild.log
            ${{ runner.temp }}/widget-synthetic-cli-preflight/WidgetGalleryDiscovery.xcresult
            ${{ runner.temp }}/widget-synthetic-cli-preflight/widget-gallery-discovery-summary.json
            ${{ runner.temp }}/widget-synthetic-cli-preflight/widget-gallery-discovery-attachments
          if-no-files-found: error
          retention-days: 7
