name: Widget desktop UI smoke
on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Reuse package artifact from a previous proof run
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: pr4890-widget-proof
  cancel-in-progress: true
jobs:
  installed-widget:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode and record provenance
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          if test -d /Applications/Xcode_27.0.app; then
            sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          fi
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/proof/incomplete-fixture"
          echo incomplete > "$RUNNER_TEMP/proof/incomplete-fixture/phase"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/fixture-sha.txt"
          git show --format=fuller HEAD > "$RUNNER_TEMP/proof/fixture-and-product.patch"
          shasum -a 256 Sources/CodexBar/UsageStore/UsageStore+WidgetSnapshot.swift Sources/CodexBarWidget/*.swift > "$RUNNER_TEMP/proof/source-hashes.txt"
      - name: Download previously built proof package
        if: inputs.package_run != '' && inputs.package_run != null
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr4890-package
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package
      - name: Package real app and WidgetKit extension
        if: inputs.package_run == '' || inputs.package_run == null
        run: |
          set -euo pipefail
          command -v xcodegen || brew install xcodegen
          ARCHES=arm64 CODEXBAR_SIGNING=adhoc ./Scripts/package_app.sh debug > "$RUNNER_TEMP/proof/package.log" 2>&1
          codesign --verify --deep --strict CodexBar.app
          codesign -d --entitlements :- CodexBar.app > "$RUNNER_TEMP/proof/app-entitlements.plist"
          codesign -d --entitlements :- CodexBar.app/Contents/PlugIns/CodexBarWidget.appex > "$RUNNER_TEMP/proof/widget-entitlements.plist"
          shasum -a 256 CodexBar.app/Contents/MacOS/CodexBar CodexBar.app/Contents/PlugIns/CodexBarWidget.appex/Contents/MacOS/CodexBarWidget > "$RUNNER_TEMP/proof/binary-hashes.txt"
      - name: Preserve built package for UI-only retries
        if: inputs.package_run == '' || inputs.package_run == null
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          ditto -c -k --sequesterRsrc --keepParent CodexBar.app "$RUNNER_TEMP/package/CodexBar.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/package/built-sha.txt"
      - name: Upload reusable package
        if: inputs.package_run == '' || inputs.package_run == null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr4890-package
          path: ${{ runner.temp }}/package
          retention-days: 7
      - name: Unpack reused package
        if: inputs.package_run != '' && inputs.package_run != null
        run: ditto -x -k "$RUNNER_TEMP/package/CodexBar.zip" .
      - name: Install and launch isolated synthetic app
        run: |
          set -euo pipefail
          cp -R CodexBar.app /Applications/CodexBar.app
          cp "$RUNNER_TEMP/package/built-sha.txt" "$RUNNER_TEMP/proof/package-built-sha.txt"
          codesign --verify --deep --strict /Applications/CodexBar.app
          shasum -a 256 /Applications/CodexBar.app/Contents/MacOS/CodexBar /Applications/CodexBar.app/Contents/PlugIns/CodexBarWidget.appex/Contents/MacOS/CodexBarWidget > "$RUNNER_TEMP/proof/installed-binary-hashes.txt"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/CodexBar.app
          pluginkit -a /Applications/CodexBar.app/Contents/PlugIns/CodexBarWidget.appex
          pluginkit -m -A -D -i com.steipete.codexbar.debug.widget > "$RUNNER_TEMP/proof/registration.txt"
          /Applications/CodexBar.app/Contents/MacOS/CodexBar --widget-host-proof "$RUNNER_TEMP/proof" > "$RUNNER_TEMP/proof/app.log" 2>&1 &
          sleep 4
          test -f "$RUNNER_TEMP/proof/complete-transport.json"
      - name: Enable disposable runner Notification Center
        run: launchctl load -w /System/Library/LaunchAgents/com.apple.notificationcenterui.plist
      - name: Install real large desktop widget and verify complete history
        run: |
          set -euo pipefail
          xcodebuild test -project .github/proof/WidgetDesktopSmoke/WidgetDesktopSmoke.xcodeproj \
            -scheme WidgetDesktopSmoke -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ui-build" -resultBundlePath "$RUNNER_TEMP/proof/Complete.xcresult" \
            -only-testing:WidgetDesktopSmokeUITests/WidgetHostProofTests/testInstallAndVerifyCompleteHistory \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            > "$RUNNER_TEMP/proof/complete-ui-test.log" 2>&1
      - name: Publish incomplete history through same running fixture app
        run: |
          set -euo pipefail
          echo incomplete > "$RUNNER_TEMP/proof/phase"
          for attempt in $(seq 1 20); do
            test -f "$RUNNER_TEMP/proof/incomplete-transport.json" && break
            sleep 1
          done
          python3 - <<'PYPROOF'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof'
          before = json.loads((root / 'complete-transport.json').read_text())
          after = json.loads((root / 'incomplete-transport.json').read_text())
          assert before['decodedModelCount'] == 2 and before['incompleteRequestCount'] == 0
          assert after['decodedModelCount'] == 0 and after['incompleteRequestCount'] == 1
          assert after['dailyPointCount'] == 14 and after['containerIsGroupContainer']
          assert before['matchingDayCost'] == after['matchingDayCost'] == 10
          assert before['matchingDayTokens'] == after['matchingDayTokens'] == 100
          PYPROOF
      - name: Verify retained installed widget renders chart fallback
        run: |
          set -euo pipefail
          xcodebuild test -project .github/proof/WidgetDesktopSmoke/WidgetDesktopSmoke.xcodeproj \
            -scheme WidgetDesktopSmoke -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ui-build" -resultBundlePath "$RUNNER_TEMP/proof/Incomplete.xcresult" \
            -only-testing:WidgetDesktopSmokeUITests/WidgetHostProofTests/testRetainedWidgetShowsIncompleteHistoryChart \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            > "$RUNNER_TEMP/proof/incomplete-ui-test.log" 2>&1
      - name: Export screenshot and hierarchy attachments
        if: always()
        run: |
          for phase in Complete Incomplete; do
            if test -d "$RUNNER_TEMP/proof/$phase.xcresult"; then
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/proof/$phase.xcresult" --output-path "$RUNNER_TEMP/proof/attachments-$phase"
            fi
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr4890-installed-widget
          path: ${{ runner.temp }}/proof
          retention-days: 7
