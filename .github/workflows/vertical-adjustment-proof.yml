name: Menubar native capsule - sequential physical red and green

on:
  push:
    branches: [proof/20261106-review-regressions]
    paths: [proofkit/vertical-adjustment/physical_proof.py, proofkit/vertical-adjustment/prephysical-ee6b.patch, proofkit/vertical-adjustment/tests/**, proofkit/vertical-adjustment/candidate.patch, proofkit/vertical-adjustment/Render.swift.fragment, proofkit/vertical-adjustment/render_verdict.py, .github/workflows/vertical-adjustment-proof.yml]

permissions:
  contents: read

jobs:
  attachment-proof:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      PRODUCT_SHA: 5614c2736caf037cd5205151194dd036f205f792
      CODEXBAR_DISABLE_KEYCHAIN_ACCESS: "1"
      CODEXBAR_SUPPRESS_TEST_KEYCHAIN_ACCESS: "1"
      CODEXBAR_TEST_NATIVE_TIMEOUT: "2400"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: kit, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - name: Select installed Xcode and containment-capable Python
        shell: bash
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
          proof_python=""
          for candidate in "$(command -v python3)" /opt/homebrew/bin/python3.14 /opt/homebrew/opt/python@3.14/bin/python3.14; do
            if [[ -x "$candidate" ]] && "$candidate" -c 'import os; assert all(hasattr(os, n) for n in ("waitid", "P_PID", "WEXITED", "WNOHANG", "WNOWAIT"))'; then
              proof_python="$candidate"
              break
            fi
          done
          if [[ -z "$proof_python" ]]; then
            brew install python@3.14
            proof_python="$(brew --prefix python@3.14)/bin/python3.14"
          fi
          "$proof_python" -c 'import os; assert all(hasattr(os, n) for n in ("waitid", "P_PID", "WEXITED", "WNOHANG", "WNOWAIT"))'
          mkdir -p "$RUNNER_TEMP/proof-python" "$RUNNER_TEMP/review-regression-proof"
          ln -s "$proof_python" "$RUNNER_TEMP/proof-python/python3"
          echo "$RUNNER_TEMP/proof-python" >> "$GITHUB_PATH"
          echo "PROOF_OUT=$RUNNER_TEMP/review-regression-proof" >> "$GITHUB_ENV"
          { sw_vers; xcodebuild -version; "$proof_python" --version; launchctl managername; } > "$RUNNER_TEMP/review-regression-proof/environment.txt"
      - name: Prepare actual intermediate source and frozen physical oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_OUT/red"
          python3 kit/proofkit/vertical-adjustment/physical_proof.py prepare --expect red --product product --output "$PROOF_OUT/red" > "$PROOF_OUT/red/filter.txt"
          cat "$PROOF_OUT/red/provenance.json"
      - name: Require new native capsule RED and all previous twenty controls passing
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          filter=$(cat "$PROOF_OUT/red/filter.txt")
          set +e
          ./Scripts/test_fast.sh --jobs 2 --filter "$filter" > "$PROOF_OUT/red/tests.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$PROOF_OUT/red/test-exit.txt"
          tail -100 "$PROOF_OUT/red/tests.log"
          python3 ../kit/proofkit/vertical-adjustment/physical_proof.py verify --expect red --product . --output "$PROOF_OUT/red" --exit-code "$result"
      - name: Apply final production delta while preserving physical oracle bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_OUT/green"
          python3 kit/proofkit/vertical-adjustment/physical_proof.py transition --expect green --product product --prior "$PROOF_OUT/red" --output "$PROOF_OUT/green" > "$PROOF_OUT/green/filter.txt"
          cat "$PROOF_OUT/green/provenance.json"
      - name: Require all twenty-one tests GREEN with the same physical oracle
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          filter=$(cat "$PROOF_OUT/green/filter.txt")
          set +e
          ./Scripts/test_fast.sh --jobs 2 --filter "$filter" > "$PROOF_OUT/green/tests.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$PROOF_OUT/green/test-exit.txt"
          tail -100 "$PROOF_OUT/green/tests.log"
          python3 ../kit/proofkit/vertical-adjustment/physical_proof.py verify --expect green --product . --output "$PROOF_OUT/green" --exit-code "$result"
      - name: Capture optional synthetic component fixture after deterministic green
        continue-on-error: true
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_OUT="$PROOF_OUT/green"
          mkdir -p "$PROOF_OUT/rendered"
          export VERTICAL_PROOF_OUTPUT="$PROOF_OUT/rendered"
          export PROOF_PRODUCT_SHA="$PRODUCT_SHA"
          export PROOF_DELTA_SHA=$(python3 -c 'import json,os; print(json.load(open(os.environ["PROOF_OUT"]+"/provenance.json"))["candidate_patch_sha256"])')
          shasum -a 256 Tests/CodexBarTests/MenuBarUsageTotalTests.swift > "$PROOF_OUT/rendered/test-before-sha256.txt"
          cat ../kit/proofkit/vertical-adjustment/Render.swift.fragment >> Tests/CodexBarTests/MenuBarUsageTotalTests.swift
          shasum -a 256 Tests/CodexBarTests/MenuBarUsageTotalTests.swift > "$PROOF_OUT/rendered/test-render-sha256.txt"
          cp Tests/CodexBarTests/MenuBarUsageTotalTests.swift "$PROOF_OUT/rendered/fixture.swift"
          git diff --binary HEAD > "$PROOF_OUT/rendered/render-harness.patch"
          set +e
          ./Scripts/test_fast.sh --jobs 2 --filter 'MenuBarUsageTotalTests.*render synthetic saved vertical adjustments' > "$PROOF_OUT/rendered/tests.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$PROOF_OUT/rendered/test-exit.txt"
          tail -80 "$PROOF_OUT/rendered/tests.log"
          python3 ../kit/proofkit/vertical-adjustment/render_verdict.py . "$PROOF_OUT" "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vertical-physical-red-green-${{ env.PRODUCT_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-regression-proof
          retention-days: 14
